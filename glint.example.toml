# Copy to glint.toml and fill in. glint.toml holds credentials and is kept out of git.

# To keep the conversation across restarts, save it to a file. It holds query results.
# history = "glint-history.jsonl"

[database]
# A libpq connection string: a URL, or key=value pairs if the password has special characters.
connection = "postgresql://user:password@localhost:5432/dbname"

[model]
# Any OpenAI-compatible endpoint with tool calling; this is the University of Illinois's Lumen.
base_url = "https://lumen.computes.illinois.edu/v1"
api_key = "your-api-key"
name = "qwen3.6-35b-a3b"
# Sent as the request's reasoning_effort. Unset, it isn't sent, and the model keeps its own default.
# reasoning_effort = "medium"

[harness]
# Model requests per user message. The last one must answer without querying.
# max_steps = 100
# Beliefs the model is asked to keep at most. It sees its beliefs instead of the conversation.
# max_beliefs = 50
# Steps the model sees besides its beliefs. It revises its beliefs every this many steps.
# recent_steps = 10

[effects]
# The effects a query may have. A query with any other effect is rejected.
allow = [
    "reads_data",
    # "writes_data",
    "reads_catalog",  # every query looks up names, types and operators in the catalog
    # "writes_catalog",
    "reads_session_settings",  # every query reads settings such as search_path and TimeZone
    # "writes_session_settings",
    # "reads_session_state",
    # "writes_session_state",
    # "reads_server",
    # "writes_server",
    # "reads_processes",
    # "writes_processes",
    # "reads_locks",
    # "writes_locks",
    # "reads_files",
    # "writes_files",
    # "reads_network",
    # "writes_network",
    "reads_clock",  # every query may read the time, e.g. through 'today' or now()
    "reads_random_source",  # gen_random_uuid()
    # "opaque",  # code outside pg_catalog
    # "unclassified",  # anything not yet classified
]
