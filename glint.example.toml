# Copy to glint.toml and fill in. glint.toml holds credentials and is kept out of git.

# To keep the conversation across restarts, save it to a file. It holds query results.
# history = "glint-history.jsonl"

[database]
# A libpq connection string: a URL, or key=value pairs if the password has special characters.
connection = "postgresql://user:password@localhost:5432/dbname"

[model]
# Any OpenAI-compatible endpoint with tool calling; this is the University of Illinois's Lumen.
base_url = "https://lumen.computes.illinois.edu/v1"
api_key = "your-api-key"
name = "qwen3.6-35b-a3b"

[effects]
# The effects a query may have. A query with any other effect is rejected.
allow = [
    "reads_data",
    # "writes_data",
    "reads_catalog",
    # "writes_catalog",
    "reads_session",  # TimeZone and locale, used by date_trunc, extract and to_char
    # "writes_session",
    # "reads_server",
    # "writes_server",
    # "reads_processes",
    # "writes_processes",
    # "reads_locks",
    # "writes_locks",
    # "reads_files",
    # "writes_files",
    # "reads_network",
    # "writes_network",
    "reads_clock",  # now() and current_date
    # "opaque",  # code outside pg_catalog
    # "unclassified",  # anything not yet classified
]
