[project]
name = "glint-viz"
version = "0.1.0"
description = "Find the insights hiding in your data."
readme = "README.md"
authors = [
    { name = "Wenqi He", email = "wenqihe2@illinois.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "openai>=3.42.1",
    "pglast>=8.7",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
]

[project.scripts]
glint = "glint:main"

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "glint"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]
