# For make dev: the test database and a local model, so nothing leaves this machine.
# No secrets here, unlike glint.toml.

# Kept so the conversation can be inspected. Delete it to start fresh.
history = "glint-history-dev.jsonl"

[database]
connection = "postgresql://postgres:postgres@127.0.0.1:15432/pagila"

[model]
base_url = "http://localhost:11434/v1"  # Ollama's OpenAI-compatible endpoint
api_key = "ollama"  # ignored by Ollama, but the client needs a value
name = "qwen3.6:27b"
recent_results = 20
max_steps = 100

[effects]
allow = ["reads_data", "reads_catalog", "reads_session_settings", "reads_clock", "reads_random_source"]
